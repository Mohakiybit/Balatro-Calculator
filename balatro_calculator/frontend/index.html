<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balatro-Style Score Calculator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #eee; }
  h1 { color: #f9c74f; }
  .card-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  select { padding: 6px; border-radius: 4px; background: #2a2a4a; color: #eee; border: 1px solid #555; }
  fieldset { border: 1px solid #555; border-radius: 8px; margin-bottom: 20px; padding: 15px; }
  legend { color: #f9c74f; padding: 0 8px; }
  #jokerList { list-style: none; padding: 0; }
  #jokerList li { background: #2a2a4a; margin: 4px 0; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  button { background: #f9c74f; color: #1a1a2e; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  button:hover { background: #f8b64c; }
  .remove-btn { background: #e63946; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  #result { background: #2a2a4a; border-radius: 8px; padding: 20px; margin-top: 20px; }
  .step { padding: 6px 0; border-bottom: 1px solid #444; font-family: monospace; font-size: 14px; }
  #finalScore { font-size: 28px; color: #f9c74f; font-weight: bold; margin-top: 10px; }
  small { color: #aaa; }
</style>
</head>
<body>

<h1>🃏 Balatro-Style Score Calculator</h1>
<p><small>Select 5 cards and add jokers (order matters!) to see a step-by-step score breakdown.</small></p>

<fieldset>
  <legend>Your Hand</legend>
  <div id="cardInputs"></div>
</fieldset>

<fieldset>
  <legend>Jokers (applied in the order shown — reorder to see the effect!)</legend>
  <select id="jokerSelect"></select>
  <button onclick="addJoker()">Add Joker</button>
  <ul id="jokerList"></ul>
</fieldset>

<button onclick="calculateScore()" style="font-size: 16px; padding: 14px 24px;">Calculate Score</button>

<div id="result" style="display:none;">
  <h2>Result: <span id="handType"></span></h2>
  <div id="steps"></div>
  <div id="finalScore"></div>
</div>

<script>
const API_BASE = "http://localhost:8000"; // change if your API runs elsewhere

let reference = null;
let selectedJokers = [];

async function loadReference() {
  const res = await fetch(`${API_BASE}/cards/reference`);
  reference = await res.json();
  buildCardInputs();
  await loadJokerOptions();
}

function buildCardInputs() {
  const container = document.getElementById("cardInputs");
  container.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const row = document.createElement("div");
    row.className = "card-row";

    row.appendChild(makeSelect(`rank-${i}`, reference.ranks));
    row.appendChild(makeSelect(`suit-${i}`, reference.suits));
    row.appendChild(makeSelect(`enh-${i}`, reference.enhancements, "Enhancement"));
    row.appendChild(makeSelect(`ed-${i}`, reference.editions, "Edition"));

    container.appendChild(row);
  }
}

function makeSelect(id, options, label) {
  const select = document.createElement("select");
  select.id = id;
  options.forEach(opt => {
    const o = document.createElement("option");
    o.value = opt;
    o.textContent = label ? `${label}: ${opt}` : opt;
    select.appendChild(o);
  });
  return select;
}

async function loadJokerOptions() {
  const res = await fetch(`${API_BASE}/jokers`);
  const jokers = await res.json();
  const select = document.getElementById("jokerSelect");
  select.innerHTML = "";
  jokers.forEach(j => {
    const o = document.createElement("option");
    o.value = j.name;
    o.textContent = `${j.name} — ${j.description}`;
    select.appendChild(o);
  });
}

function addJoker() {
  const select = document.getElementById("jokerSelect");
  selectedJokers.push(select.value);
  renderJokerList();
}

function removeJoker(index) {
  selectedJokers.splice(index, 1);
  renderJokerList();
}

function renderJokerList() {
  const list = document.getElementById("jokerList");
  list.innerHTML = "";
  selectedJokers.forEach((name, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${i + 1}. ${name}</span>`;
    const btn = document.createElement("button");
    btn.className = "remove-btn";
    btn.textContent = "Remove";
    btn.onclick = () => removeJoker(i);
    li.appendChild(btn);
    list.appendChild(li);
  });
}

async function calculateScore() {
  const cards = [];
  for (let i = 0; i < 5; i++) {
    cards.push({
      rank: document.getElementById(`rank-${i}`).value,
      suit: document.getElementById(`suit-${i}`).value,
      enhancement: document.getElementById(`enh-${i}`).value,
      edition: document.getElementById(`ed-${i}`).value,
    });
  }

  const res = await fetch(`${API_BASE}/score`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cards, joker_names: selectedJokers }),
  });

  if (!res.ok) {
    alert("Error calculating score — check console for details.");
    console.error(await res.text());
    return;
  }

  const data = await res.json();
  displayResult(data);
}

function displayResult(data) {
  document.getElementById("result").style.display = "block";
  document.getElementById("handType").textContent = data.hand_type;

  const stepsDiv = document.getElementById("steps");
  stepsDiv.innerHTML = "";
  data.steps.forEach((step, i) => {
    const div = document.createElement("div");
    div.className = "step";
    div.textContent = `${i + 1}. ${step.description}  →  ${step.chips.toFixed(0)} chips × ${step.mult.toFixed(1)} mult`;
    stepsDiv.appendChild(div);
  });

  document.getElementById("finalScore").textContent =
    `Final Score: ${data.final_chips.toFixed(0)} × ${data.final_mult.toFixed(1)} = ${data.total_score}`;
}

loadReference();
</script>

</body>
</html>
